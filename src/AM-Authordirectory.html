<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Books - Author List</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 27, 75, 0.85)),
      url('https://images.unsplash.com/photo-1455390582262-044cdead277a?q=80&w=1920&auto=format&fit=crop') !important;
      background-size: cover !important;
      background-position: center !important;
      background-repeat: no-repeat !important;
      background-attachment: fixed !important;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #f8fafc;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .table-glass {
      background: rgba(255, 255, 255, 0.03);
      color: #f8fafc;
    }

    .table-glass th, .table-glass td {
      background: transparent !important;
      color: #f8fafc !important;
      border-color: rgba(255, 255, 255, 0.1) !important;
    }
  </style>
</head>
<body class="py-5">

<div class="container">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <a href="Main_web_index.html" class="text-decoration-none text-white fs-4 fw-bold mb-1 d-inline-block">
        <i class="fa-solid fa-book-open text-primary me-2"></i>AURA BOOKS
      </a>
      <h2 class="fw-bold text-white mb-0"><i class="fa-solid fa-pen-nib me-2 text-primary"></i>Author Management</h2>
      <p class="text-white-50 small mb-0">View and manage registered authors in Aura Books.</p>
    </div>
    <a href="Main_web_index.html" class="btn btn-outline-light btn-sm">
      <i class="fa-solid fa-house me-1"></i>Home
    </a>
  </div>

  <!-- Author List Table Card -->
  <div class="glass-card p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="text-white m-0">Registered Authors</h5>
      <a href="AM-Addauthor.html" class="btn btn-primary btn-sm">
        <i class="fa-solid fa-user-plus me-1"></i>Add New Author
      </a>
    </div>

    <div class="table-responsive">
      <table class="table table-glass align-middle mb-0">
        <thead>
        <tr>
          <th>#ID</th>
          <th>Author Name</th>
          <th>Biography</th>
          <th class="text-center">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr>
          <td>01</td>
          <td>Martin Wickramasinghe</td>
          <td>Famous Sri Lankan novelist and writer.</td>
          <td class="text-center">
            <a href="AM-Editauthor.html" class="btn btn-sm btn-outline-info me-1"><i class="fa-solid fa-pen-to-square"></i></a>
            <button class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

</body>
</html>
