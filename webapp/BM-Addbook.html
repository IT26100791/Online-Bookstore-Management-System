<!DOCTYPE html>
<html>
<head>
    <title>Add Book - Online Bookstore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<div class="col-md-6 offset-md-3">
    <h3>Add New Book</h3>
    <form action="#" method="post">
        <div class="mb-3"><label>ISBN / Book ID</label><input type="text" class="form-control" required></div>
        <div class="mb-3"><label>Title</label><input type="text" class="form-control" required></div>
        <div class="mb-3"><label>Genre</label><input type="text" class="form-control" required></div>
        <div class="mb-3"><label>Price ($)</label><input type="number" step="0.01" class="form-control" required></div>
        <button type="submit" class="btn btn-primary">Add Book</button>
    </form>
</div>
</body>
</html>
