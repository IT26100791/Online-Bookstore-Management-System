<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Aura Books</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="navbar">
    <a href="Main_web_index.html" class="logo">AURA BOOKS</a>
    <div class="nav-links"><a href="UM-Login.html">Login</a></div>
</nav>
<div class="container mt-5" style="max-width: 520px;">
    <div class="card-glass">
        <h3 class="mb-4 text-center">User Registration</h3>
        <form action="#" method="post">
            <div class="mb-3"><label>Full Name</label><input type="text" class="form-control" required></div>
            <div class="mb-3"><label>Email Address</label><input type="email" class="form-control" required></div>
            <div class="mb-3"><label>Role</label>
                <select class="form-select"><option>Customer</option><option>Admin</option></select>
            </div>
            <div class="mb-4"><label>Password</label><input type="password" class="form-control" required></div>
            <button type="submit" class="btn-glass w-100">Create Account</button>
        </form>
    </div>
</div>
</body>
</html>
