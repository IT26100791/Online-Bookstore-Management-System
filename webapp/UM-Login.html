<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Login | Aura Books</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="navbar">
    <a href="Main_web_index.html" class="logo">AURA BOOKS</a>
    <div class="nav-links"><a href="UM-Register.html">Register</a></div>
</nav>
<div class="container mt-5" style="max-width: 480px;">
    <div class="card-glass">
        <h3 class="mb-4 text-center">System Login</h3>
        <form action="#" method="post">
            <div class="mb-3"><label>Username / Email</label><input type="text" class="form-control" required></div>
            <div class="mb-4"><label>Password</label><input type="password" class="form-control" required></div>
            <button type="submit" class="btn-glass w-100">Login</button>
        </form>
        <p class="text-center mt-3 text-secondary" style="font-size: 0.85rem;">Don't have an account? <a href="UM-Register.html" class="text-info">Register here</a></p>
    </div>
</div>
</body>
</html>
