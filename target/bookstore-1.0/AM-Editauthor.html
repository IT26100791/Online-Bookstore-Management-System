<!DOCTYPE html>
<html lang="en">
<!-- Updated author form UI -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Books - Edit Author</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 27, 75, 0.85)),
            url('https://images.unsplash.com/photo-1455390582262-044cdead277a?q=80&w=1920&auto=format&fit=crop') !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f8fafc;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #6366f1;
            color: #f8fafc;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }

        .form-control::placeholder {
            color: rgba(248, 250, 252, 0.4);
        }

        .form-label {
            color: #cbd5e1;
            font-weight: 500;
        }
    </style>
</head>
<body class="py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="glass-card p-4 p-md-5">
                <h3 class="text-white fw-bold mb-1 text-center"><i class="fa-solid fa-pen-to-square me-2 text-info"></i>Edit Author</h3>
                <p class="text-white-50 text-small text-center mb-4">Update existing author information.</p>

                <form>
                    <div class="mb-3">
                        <label for="authorName" class="form-label">Author Name</label>
                        <input type="text" class="form-control" id="authorName" value="Martin Wickramasinghe" required>
                    </div>

                    <div class="mb-4">
                        <label for="biography" class="form-label">Biography</label>
                        <textarea class="form-control" id="biography" rows="4">Famous Sri Lankan novelist and writer.</textarea>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="AM-Authorlist.html" class="btn btn-outline-light">
                            <i class="fa-solid fa-arrow-left me-1"></i>Cancel
                        </a>
                        <button type="submit" class="btn btn-info text-white fw-semibold">
                            <i class="fa-solid fa-rotate me-1"></i>Update Author
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>

</body>
</html>
